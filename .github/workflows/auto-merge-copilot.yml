name: Auto-merge Copilot PRs

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge open Copilot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --repo ${{ github.repository }} --author "Copilot" --state open --json number,isDraft,mergeable --jq '.[] | @base64' | while read -r row; do
            pr=$(echo "$row" | base64 -d)
            number=$(echo "$pr" | jq -r .number)
            draft=$(echo "$pr" | jq -r .isDraft)
            if [ "$draft" = "true" ]; then
              gh pr ready "$number" --repo ${{ github.repository }} || true
            fi
            gh pr merge "$number" --repo ${{ github.repository }} --squash --auto || true
          done